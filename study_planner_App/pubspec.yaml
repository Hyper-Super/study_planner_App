name: study_planner
description: A beautiful study planner app with AI features
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──────────────────────────────────────────────────────────────────────
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0
  animated_text_kit: ^4.2.2
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.2

  # ── State / Storage ─────────────────────────────────────────────────────────
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.18.1

  # ── AI / Networking ──────────────────────────────────────────────────────────
  http: ^1.2.1
  uuid: ^4.3.3

  # ── Firebase ─────────────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0       # Profile image upload

  # ── Social Auth ──────────────────────────────────────────────────────────────
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3

  # ── Media ────────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2             # Profile photo picker (gallery + camera)

  # ── Notifications ────────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # ── Audio ─────────────────────────────────────────────────────────────────
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
